<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026년 하반기 한미그룹 공개채용</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{
  --black:#000;
  --white:#fff;
  --red:#E60012;
  --red-grad:linear-gradient(90deg,#E60012 0%,#FF5D32 100%);
  --font:'Pretendard','Inter','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --ease:.2s ease;
  --wide:1920px;
  --inner:1440px;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--font);color:var(--black);background:var(--white);-webkit-font-smoothing:antialiased;word-break:keep-all}
h1,h2,p,ul{margin:0;padding:0}
ul{list-style:none}
a{color:inherit;text-decoration:none;transition:color var(--ease),background-color var(--ease),border-color var(--ease),opacity var(--ease)}
img{display:block;max-width:100%}
:focus-visible{outline:3px solid var(--red);outline-offset:3px}

/* ===== Header ===== */
.header{position:absolute;top:0;left:0;right:0;height:100px;z-index:10}
.header__inner{max-width:var(--inner);height:100%;margin:0 auto;padding:0 60px;display:flex;align-items:center;justify-content:space-between}
.logo{display:block;width:182px;height:31px}
.logo img{width:182px;height:31px}
.gnb{display:flex;align-items:center;height:100%}
.gnb__list{display:flex;gap:40px;height:100%}
.gnb__item{display:flex;align-items:center;height:100%}
.gnb__link{font-size:19.1px;line-height:20px;font-weight:600;letter-spacing:-.4px;white-space:nowrap}
.gnb__link:hover,.gnb__link:focus-visible{color:var(--red)}
.gnb__cta{margin-left:40px}

/* ===== Buttons ===== */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;border-radius:500px;font-weight:600;color:var(--white);border:2px solid transparent;overflow:hidden;isolation:isolate;cursor:pointer;transition:color var(--ease),background-color var(--ease),border-color var(--ease)}
.btn::before{content:"";position:absolute;inset:0;z-index:-1;transition:opacity var(--ease)}
.btn--sm{gap:10px;height:48px;padding:0 18px 0 18px;font-size:17.4px;line-height:18px;letter-spacing:-.36px;background:var(--red);border-color:var(--red)}
.btn--sm:hover,.btn--sm:focus-visible{background:var(--white);color:var(--red)}
.btn--sm svg{width:7px;height:12px;flex:none}
.btn--lg{width:303px;height:72px;font-size:22.7px;line-height:34px;letter-spacing:-.48px;background:var(--white);border-color:transparent}
.btn--lg::before{background:var(--red-grad)}
.btn--lg:hover,.btn--lg:focus-visible{color:var(--red);border-color:var(--red)}
.btn--lg:hover::before,.btn--lg:focus-visible::before{opacity:0}

/* ===== Main visual ===== */
.mv{position:relative;height:900px;min-height:720px;overflow:hidden;background:#FFF1EC url(./images/mv_bg.png) center/cover no-repeat}
.mv__inner{position:relative;max-width:var(--inner);height:100%;margin:0 auto;padding:0 100px;display:flex;align-items:center}
.mv__text{display:flex;flex-direction:column;align-items:flex-start;gap:80px;width:560px;position:relative;z-index:2}
.mv__copy{display:flex;flex-direction:column;gap:31.9px}
.mv__season{font-size:31.1px;line-height:45px;font-weight:700;letter-spacing:-.64px}
.mv__title{display:flex;flex-direction:column}
.mv__brand{font-size:72.3px;line-height:76px;font-weight:800;letter-spacing:-1.76px}
.mv__job{font-size:45.8px;line-height:72px;font-weight:800;letter-spacing:-1.12px}
.mv__period{font-size:19.2px;line-height:28px;font-weight:500;letter-spacing:-.4px}

/* art stage: 겹침 구성이라 이 영역 안에서만 absolute 사용 */
.mv__art{position:absolute;top:100px;right:0;width:740px;height:660px;pointer-events:none;z-index:1}
.mv__art img,.mv__art .star{position:absolute}
.ring{position:absolute;border-radius:500px}
.ring--glow{left:0;top:18px;width:663px;height:663px;border:5px solid var(--white);filter:blur(5px);background:radial-gradient(70.71% 70.71% at 50% 50%,rgba(255,255,255,.2) 0%,rgba(255,255,255,0) 100%)}
.ring--line{left:55px;top:73px;width:553px;height:553px;border:1px solid rgba(255,255,255,.5)}
.mv__art .micro{left:66px;top:52px;width:289.5px;height:221.8px}
.mv__art .char1{left:115px;top:195px;width:253.4px;height:395.1px}
.mv__art .char2{left:337px;top:193px;width:181.3px;height:381px}
.mv__art .char3{left:39px;top:369px;width:216.5px;height:262.2px}
.mv__art .char4{left:396px;top:390px;width:292.2px;height:206.8px}
.star{display:block}
.star svg{display:block;width:100%;height:100%}
.star--white{left:222px;top:137px;width:17.6px;height:17.6px}
.star--red{left:461px;top:149px;width:24px;height:25px}
.star--yellow-l{left:633px;top:332px;width:34px;height:35px}
.star--yellow-s{left:615px;top:375px;width:21px;height:21px}
.star--purple{left:40px;top:370px;width:23px;height:24px}
@media (prefers-reduced-motion:no-preference){
  .star{animation:twinkle 3.2s ease-in-out infinite}
  .star--red{animation-delay:.6s}.star--yellow-l{animation-delay:1.2s}.star--yellow-s{animation-delay:1.8s}.star--purple{animation-delay:2.4s}
}
@keyframes twinkle{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(.85)}}

/* scroll button */
.scroll{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);z-index:3;width:80px;height:80px;padding:0;border:0;border-radius:500px;cursor:pointer;display:flex;align-items:center;justify-content:center;isolation:isolate;
  background:linear-gradient(132.3deg,rgba(255,255,255,.8) 12.7%,rgba(255,255,255,0) 86.3%);
  box-shadow:inset 4px 4px 10px rgba(255,255,255,.4),inset -4px -4px 10px rgba(0,0,0,.1);
  -webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);transition:background-color var(--ease),box-shadow var(--ease)}
.scroll::before{content:"";position:absolute;inset:0;border-radius:inherit;background:rgba(255,255,255,.1);z-index:-1;transition:background-color var(--ease)}
.scroll svg{width:40px;height:40px;stroke:var(--white);transition:stroke var(--ease)}
.scroll:hover::before,.scroll:focus-visible::before{background:var(--white)}
.scroll:hover svg,.scroll:focus-visible svg{stroke:var(--red)}

/* ===== 반응형 (1440 미만에서 축소) ===== */
@media (max-width:1280px){
  .mv__art{transform:scale(.82);transform-origin:right center;right:-20px}
  .gnb__list{gap:28px}
}
@media (max-width:1024px){
  .header{height:72px}
  .gnb__list{display:none}
  .gnb__cta{margin-left:0}
  .header__inner{padding:0 24px}
  .mv{height:auto;min-height:100vh;padding:112px 0 160px}
  .mv__inner{flex-direction:column;align-items:flex-start;padding:0 24px;gap:24px}
  .mv__text{width:100%;gap:40px}
  .mv__brand{font-size:56px;line-height:60px}
  .mv__job{font-size:36px;line-height:56px}
  .mv__art{position:relative;top:auto;right:auto;transform:scale(.62);transform-origin:left top;width:740px;height:660px;margin-bottom:-250px}
}
@media (max-width:600px){
  .mv__art{transform:scale(.46);margin-bottom:-340px}
  .mv__period{font-size:16px}
  .btn--lg{width:100%;max-width:303px}
}
</style>
</head>
<body>

<header class="header">
  <div class="header__inner">
    <a class="logo" href="/" aria-label="한미그룹 홈"><img src="./images/logo.svg" alt="Hanmi 한미그룹" width="182" height="31"></a>
    <nav class="gnb" aria-label="주요 메뉴">
      <ul class="gnb__list">
        <li class="gnb__item"><a class="gnb__link" href="#jobs">직무소개</a></li>
        <li class="gnb__item"><a class="gnb__link" href="#apply-guide">지원자격 및 접수방법</a></li>
        <li class="gnb__item"><a class="gnb__link" href="#session">채용설명회 일정</a></li>
      </ul>
      <a class="btn btn--sm gnb__cta" href="#apply">
        <span>지원하기</span>
        <svg viewBox="0 0 7 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 1l5 5-5 5"/></svg>
      </a>
    </nav>
  </div>
</header>

<main>
  <section class="mv" id="main-visual" aria-labelledby="mv-title">
    <div class="mv__inner">
      <div class="mv__text">
        <div class="mv__copy">
          <p class="mv__season">2026년 하반기</p>
          <h1 class="mv__title" id="mv-title">
            <span class="mv__brand">한미그룹</span>
            <span class="mv__job">공개채용</span>
          </h1>
          <p class="mv__period">모집기간 : 2026.9.28(월) ~ 2026.10.18(일) 23:59까지</p>
        </div>
        <a class="btn btn--lg" href="#jobs"><span>모집직무 바로가기!</span></a>
      </div>

      <div class="mv__art" aria-hidden="true">
        <span class="ring ring--glow"></span>
        <span class="ring ring--line"></span>
        <img class="micro" src="./images/mv_micro.png" alt="">
        <img class="char1" src="./images/mv_char1.png" alt="">
        <img class="char2" src="./images/mv_char2.png" alt="">
        <img class="char3" src="./images/mv_char3.png" alt="">
        <img class="char4" src="./images/mv_char4.png" alt="">
        <span class="star star--white"><svg viewBox="0 0 24 24"><path d="M12 0c.8 7 5 11.2 12 12-7 .8-11.2 5-12 12-.8-7-5-11.2-12-12 7-.8 11.2-5 12-12z" fill="#fff" opacity=".85"/></svg></span>
        <span class="star star--red"><svg viewBox="0 0 24 24"><path d="M12 0c.8 7 5 11.2 12 12-7 .8-11.2 5-12 12-.8-7-5-11.2-12-12 7-.8 11.2-5 12-12z" fill="#FF5D32"/></svg></span>
        <span class="star star--yellow-l"><svg viewBox="0 0 24 24"><path d="M12 0c.8 7 5 11.2 12 12-7 .8-11.2 5-12 12-.8-7-5-11.2-12-12 7-.8 11.2-5 12-12z" fill="#FFC21A"/></svg></span>
        <span class="star star--yellow-s"><svg viewBox="0 0 24 24"><path d="M12 0c.8 7 5 11.2 12 12-7 .8-11.2 5-12 12-.8-7-5-11.2-12-12 7-.8 11.2-5 12-12z" fill="#FFC21A"/></svg></span>
        <span class="star star--purple"><svg viewBox="0 0 24 24"><path d="M12 0c.8 7 5 11.2 12 12-7 .8-11.2 5-12 12-.8-7-5-11.2-12-12 7-.8 11.2-5 12-12z" fill="#8F5BF0"/></svg></span>
      </div>
    </div>

    <button class="scroll" type="button" aria-label="아래로 스크롤" data-scroll>
      <svg viewBox="0 0 40 40" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 15l10 10 10-10"/></svg>
    </button>
  </section>
</main>

<script>
(function(){
  var btn=document.querySelector('[data-scroll]');
  if(!btn)return;
  btn.addEventListener('click',function(){
    var hero=document.getElementById('main-visual');
    var next=hero.nextElementSibling;
    var top=next?next.getBoundingClientRect().top+window.scrollY:hero.offsetHeight;
    window.scrollTo({top:top,behavior:'smooth'});
  });
})();
</script>
</body>
</html>
