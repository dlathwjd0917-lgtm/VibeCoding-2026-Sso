<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* 웹폰트 로딩하기(CDN방식) */
      /* CDN은 Content Delivery Network 즉, 네트워크 망으로 컨텐트를 배달시켜 쓰는 방식 */
      @import url("https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Nanum+Gothic&display=swap");
      @import url("https://cdn.jsdelivr.net/gh/moonspam/NanumBarunGothic@1.0/nanumbarungothicsubset.css");

      /* 전체 루트 설정 */
      html {
        /* rem단위를 위한 Root 글자크기설정 */
        font-size: 10px;
        /* 왜 10px인가? rem단위에 계산이 용이함! */
      }
      html,
      body {
        /* 웹폰트체 지정 (콤마는 우선순위) */
        font-family: Montserrat, "Nanum Barun Gothic", Dotum, sans-serif;
      }

      /* 공통요소 초기화 */
      /* prettier-ignore*/
      html,body,div,span,applet,object,iframe,h1,h2,h3,h4,h5,h6,p,blockquote,pre,a,abbr,acronym,address,big,cite,code,del,dfn,em,img,ins,kbd,q,s,samp,small,strike,strong,sub,sup,tt,var,b,u,i,center,dl,dt,dd,ol,ul,li,fieldset,form,label,legend,table,caption,tbody,tfoot,thead,tr,th,td,article,aside,canvas,details,embed,figure,figcaption,footer,header,hgroup,main,menu,nav,output,ruby,section,summary,time,mark,audio,video {
        margin: 0;
        padding: 0;
      }

      /* 헤더 영역 내부 스타일: 최대 너비 1440px, 가운데 정렬, flex 레이아웃 배치 */
      .header-area-inner {
        max-width: 1440px;
        margin: 0 auto;
        display: flex;
        align-items: center; /* 수직 가운데 정렬 */
        justify-content: space-between; /* 좌우 끝 정렬 */
        height: 100px; /* 헤더 높이 */
      }
      /* 로고 이미지 크기 지정 */
      .logo-box img {
        height: 60px;
      }
      /* 메뉴 리스트: 가로 배치, 간격 40px, 불릿 제거, 여백 초기화 */
      .menu-list {
        display: flex;
        gap: 40px;
        list-style: none;
        margin: 0;
        padding: 0;
      }
      /* 메뉴 링크: 밑줄 제거, 상속된 색상 사용 */
      .menu-list li a {
        text-decoration: none;
        color: inherit;
        text-transform: uppercase; /* 대문자 변환 */
        text-decoration: none; /* 밑줄 제거 */
        font-size: 1.6rem;
        /* display: flex; */
        /* justify-content: center; */
        /* align-items: center; */
      }

      .banner-area {
        background: url("./images/main_visual_bg.jpg") repeat 0 0/50px;
        padding: 80px 0;
        padding-bottom: 160px;
        text-align: center;
      }
      .banner-area-content {
        /* display: flex; */
        justify-content: center;
        padding: 80px 0;
        /* align-items: center; */
      }
      .banner-area-content img {
        /* display: block; */
        width: 980px;
        max-width: 100%;
      }
      .sns-button-box {
        display: flex;
        flex-direction: column;
        position: absolute;
        top: 50px;
        right: 50px;
      }

      .scroll_btn {
        left: 50%;
        translate: -50%;
        bottom: 100px;
        position: absolute;
        width: 79px;
        height: 70px;
        /*outline: 2px solid blue;*/
      }

      /* 마우스 글자박스 */
      .scrll_btn p {
        position: absolute;
        bottom: 0;
        width: 100%;
        text-align: center;
        outline: 1px solid red;
        text-transform: uppercase;
      }

      .scroll.btn p {
        position: absolute;
        bottom: 0;
        width: 100%;
        text-align: center;
        text-transform: uppercase;
        font-size: 1rem;
        outline: 1px solid red;
      }

      .scroll_btn p {
        .scroll_btn p {
          position: absolute;
          bottom: 0;
          width: 100%;
          text-align: center;
          text-transform: uppercase;
          font-size: 1rem;
          outline: 1px solid red;
        }
        .scroll_btn p {
          position: absolute;
          bottom: 0;
          width: 100%;
          text-align: center;
          text-transform: uppercase;
          font-size: 1rem;
          outline: 1px solid red;
        }
        .scroll_btn p {
          position: absolute;
          bottom: 0;
          width: 100%;
          text-align: center;
          text-transform: uppercase;
          font-size: 1rem;
          outline: 1px solid red;
        }
        .scroll_btn p {
          position: absolute;
          bottom: 0;
          width: 100%;
          text-align: center;
          text-transform: uppercase;
          font-size: 1rem;
          outline: 1px solid red;
        }
        .scroll_btn p {
          position: absolute;
          bottom: 0;
          width: 100%;
          text-align: center;
          text-transform: uppercase;
          font-size: 1rem;
          outline: 1px solid red;
        }
        position: absolute;
        bottom: 0;
        width: 100%;
        text-align: center;
        text-transform: uppercase;
        font-size: 1rem;
        /* outline: 1px solid red; */
      }

      .scroll_btn .mouse {
        position: absolute;
        left: 50%;
        translate: -50%;
        top: 0px;
        display: block;
        width: 26px;
        height: 36px;
        border: 1px solid #222;
        border-radius: 15px;
        background: white;

        /* 애니메이션 호출 : (이시 이지반방마)
        이름 시간 이징 지연시간 반복 방향 마지막상태 */
        animation: mouse-ani 0.5s ease-in-out infinite alternate;
      }
      /* 마우스 애니메이션 키프레임 */
      @keyframes mouse-ani {
        /* 시작값 from이 처음셋팅값과 같으면 생략가능 */
        form {
          top: 0;
        }
        to {
          top: 15px;
        }
      }

      /* 움직일 대상 마우스 */
      .scroll_btn .mouse span {
        position: absolute;
        top: 27%;
        left: 50%;
        translate: -50% -50%;
        width: 5px;
        height: 5px;
        background-color: #222;
        border-radius: 50%;
        opacity: 0;
        /* 마우스휠 키프레임 호출 : 이시이지반방마 */
        animation: span-ani 1.5s linear infinite;
      }
      /* 마우스휠 애니메이션 키프레임 */
      @keyframes span-ani {
        /* 0~20%: opacity 0→1, top 27% */
        0% {
          opacity: 0;
          top: 27%;
        }
        10% {
          opacity: 1;
          top: 27%;
        }
        /* 20~55%: top 27%→50%, opacity 유지 */
        40% {
          opacity: 1;
          top: 50%;
        }
        /* 55~70%: opacity 1→0, top 유지 */
        60% {
          opacity: 0;
          top: 50%;
        }
        /* 70~100%: opacity 0, top 50%, 쉬는구간 */
        100% {
          opacity: 0;
          top: 50%;
        }
      }

      .sns-button-box {
        display: flex;
        gap: 8px;
      }
      .sns-button-box a {
        display: inline-block;
        width: 40px;
        height: 40px;
      }
      .sns-button-box a img {
        width: 40px;
        height: 40px;
        object-fit: cover;
      }

      .character-area {
        height: 100vh;
      }

      .tit-box {
        max-width: 1200px;
        margin: 0 auto;
        outline: 3px dashed blue;
      }

      h2.part-tit {
        text-align: center;
        /* padding: 40px 0; */
        margin-bottom: 30px;
        font-size: 5rem;
        font-weight: normal;
      }

      .btn-box {
        text-align: center;
        padding: 20px 0;
      }

      /* 타이틀 아래 버튼 */
      .btn-view {
        text-decoration: none;
        color: #222;
        font-size: 1.2rem;
        display: inline-block;
        margin: 0 auto;
        border-radius: 24px;
        border: 1px solid #222;
        padding: 16px 32px;
        /* 트랜지션 : 속시이지(속성 시간 이징 지연) */
        transition: all 0.5s;
      }
      /* 버튼가상요소 이미지 넣기 */
      /* 앞은 ::before , 뒤는 ::after */
      .btn-view::after {
        /* before,after의 필수속성 content */
        content: url("./images/ico_more1.png");
        padding-left: 20px;
        /* tab하면 안에 내용 바로 쓸수있음 */
      }
      /* 버튼 오버시 가상클래스 : hover를 사용함 */
      .btn-view:hover {
        color: #fff;
        background: #222;
        /* 트랜지션 양방향은 원본에 설정함! */
        /* :hover에 설정하면 오버시에만 애니됨 */
        /* transition: all .5s */
      }
      /* 버튼오버시 가상요소 after이미지변경 */
      .btn-view:hover::after {
        content: url(./images/ico_more2.png);
      }

      .character-card {
        width: 285px;
        height: 285px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
      }
      .character-card .card-top {
        height: 204px;
        display: flex;
        flex-direction: row;
        gap: 4px;
      }
      .character-card .card-bottom {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: #fff;
        border-radius: 0 0 8px 8px;
      }
      .character-card .card-bottom h3 {
        margin: 8px 0 0 0;
        font-size: 1.6rem;
      }
      .character-card .card-bottom h4 {
        margin: 4px 0 0 0;
        font-size: 1.2rem;
        color: #888;
      }
    </style>
  </head>
  <body>

      <section class="banner-area" style="position: relative">

            padding: 콘텐츠 영역과 테두리 사이의 여백

      <!-- 캐릭터영역 -->

          <div class="card-bottom">

      <!-- 컴퍼니영역 -->

    <!-- 하단영역 -->

  </body>
</html>
