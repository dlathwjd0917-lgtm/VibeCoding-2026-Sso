<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
<!-- INSERT_YOUR_CODE -->
<div class="wrapper">
    <!-- 상단영역 -->
     <!-- 인터널스타일시트(internal style sheet) -->
      
    <style>
        /* 헤더 영역 내부 스타일: 최대 너비 1440px, 가운데 정렬, flex 레이아웃 배치 */
        .header-area-inner {
            max-width: 1440px;
            margin: 0 auto;
            display: flex;
            align-items: center; /* 수직 가운데 정렬 */
            justify-content: space-between; /* 좌우 끝 정렬 */
            height: 100px; /* 헤더 높이 */
        }
        /* 로고 이미지 크기 지정 */
        .logo-box img {
            height: 60px;
        }
        /* 메뉴 리스트: 가로 배치, 간격 40px, 불릿 제거, 여백 초기화 */
        .menu-list {
            display: flex;
            gap: 40px;
            list-style: none;
            margin: 0;
            padding: 0;
        }
        /* 메뉴 링크: 밑줄 제거, 상속된 색상 사용 */
        .menu-list li a {
            text-decoration: none;
            color: inherit;
        }
       
        .banner-area {
                background: url('./images/main_visual_bg.jpg') repeat 0 0/50px;
                padding: 80px 0;
                text-align: center;
                /* display: flex; */
                /* justify-content: center; */
                /* align-items: center; */
            }
            .banner-area-content {
                /* display: flex; */
                justify-content: center;
                padding: 80px 0;
                /* align-items: center; */
            }
            .banner-area-content img {
                /* display: block; */
                width: 980px;
                max-width: 100%;
            }
    </style>
    <header class="header-area">
        <!-- INSERT_YOUR_CODE -->
        <div class="header-area-inner">
            <!-- 로고이미지박스 -->
            <div class="logo-box">
                <img src="./images/logo_2023.png" alt="Sanrio Korea Logo">
            </div>
            <!-- 메뉴리스트 -->
            <nav>
                <ul class="menu-list">
                    <li><a href="#company">company</a></li>
                    <li><a href="#character">character</a></li>
                    <li><a href="#place">place</a></li>
                    <li><a href="#recruit">recruit</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- 메인영역 -->
    <main class="main-area">
        <!-- 배너영역 -->
       
        
        </style>
        <section class="banner-area" style="position: relative;">
            <!--박스모델 기본값 5가지
            width: 콘텐츠 영역의 너비
            height: 콘텐츠 영역의 높이
            padding: 콘텐츠 영역과 테두리 사이의 여백
            margin: 콘텐츠 영역과 다른 영역 사이의 여백
            border: 테두리 두께-->

            <!--2.1배너영역-->
            <!-- INSERT_YOUR_CODE -->
            <div class="banner-area-content">
                <img src="./images/main_visual_pc_v1.png" alt="Main Visual">
            </div>
            <!-- sns이동버튼박스 -->
            <div class="sns-button-box">
      
                <a href="https://www.instagram.com/sanrio_kr/" target="_blank"><img src="./images/i_ins_pc_v3.png" alt="instargram"></a>
                <a href="https://www.youtube.com/c/sanriokorea/featured" target="_blank"><img src="./images/i_you_pc_v3.png" alt="youtube"></a>
            </div>
        </section>
        <!-- 캐릭터영역 -->
        <section class="character-area"></section>
        <!-- 컴퍼니영역 -->
        <section class="company-area"></section>
        <!-- 리쿠르트영역 -->
        <section class="recruit-area"></section>
        <!-- 플레이스영역 -->
        <section class="place-area"></section>
        <!-- 컨텍어스영역 -->
        <section class="contactus-area"></section>
    </main>

    <!-- 하단영역 -->
    <footer class="footer-area"></footer>
</div>
</body>
</html>
